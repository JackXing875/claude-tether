name: Test SSH transport
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y openssh-client openssh-server openssl bubblewrap
      - run: sudo mkdir -p /run/sshd
      - name: Allow user namespaces on this disposable CI runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev
